# Publications, rendered on /publications/ by _includes/publication.html.
# Entries are grouped by `year` (newest year first, in the order they appear
# here) and keep their order within a year.
#
# Fields
#   id       (required) Slug; the detail page lives at /publications/<id>/
#            (_pages/publications/<id>.md) and its figure at
#            /images/publications/<id>.png.
#   title    (required)
#   authors  (required) Markdown; wrap the PI's name in ** ** to bold it.
#   venue    (required) Shown in italics.
#   year     (required) The section the paper is listed under.
#   venue_year
#            Year shown after the venue, when it differs from `year`
#            (e.g. a journal issue dated the following year).
#   abbr     Short venue tag, shown on the thumbnail placeholder when there
#            is no image (e.g. CMAME, arXiv).
#   url      Main link for the paper; the title links here.
#   image    Representative figure, e.g. /images/publications/neural-chaos.png
#            (any aspect ratio; it is fitted into a 4:3 box without cropping).
#   page     Detail page for the paper, e.g. /publications/neural-chaos/.
#            When set, the thumbnail links here and a "Details" button shows.
#            The page itself is a Markdown file in _pages/publications/ using
#            `layout: publication` and `pub_id: <id>`; it holds only the
#            summary, since the header comes from this file.
#   pdf, arxiv, code
#            Optional extra links, each shown as a button.

